<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title> Please Wait </title></title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; }
</style>
</head>
<body>
<p id="msg">finding latest</p>

<script>
const API = "https://api.github.com/repos/aphidaks/aphidaks/contents/sirenosc";

const cmp = (a, b) => {
  const pa = a.slice(1).split(".").map(Number);
  const pb = b.slice(1).split(".").map(Number);
  for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
  return 0;
};

async function discoverVersions() {
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (!res.ok) return [];
    const items = await res.json();
    return items
      .filter(i => i.type === "dir" && /^v\d+\.\d+\.\d+$/.test(i.name))
      .map(i => i.name);
  } catch (e) {
    return [];
  }
}

async function hasLatest(version) {
  try {
    const res = await fetch(`${version}/latest`, { cache: "no-store" });
    return res.ok;
  } catch (e) {
    return false;
  }
}

(async () => {
  const versions = (await discoverVersions()).sort(cmp);
  for (const v of versions) {
    if (await hasLatest(v)) {
      document.getElementById("msg").textContent = `Redirecting to ${v}…`;
      location.replace(`${v}/`);
      return;
    }
  }
  document.getElementById("msg").textContent = "The latest version has not been found.";
})();
</script>
</body>
</html>
