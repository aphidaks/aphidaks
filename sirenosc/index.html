<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0d; }
  @keyframes pleaseWaitSpin { to { transform: rotate(360deg); } }
  #pleaseWaitOverlay {
    position: fixed; inset: 0; background: #0b0c0d;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .pw-spin {
    width: 28px; height: 28px; box-sizing: content-box;
    border: 3px solid #2a2d33; border-top-color: #d0d8f0; border-radius: 50%;
    animation: pleaseWaitSpin .8s linear infinite;
  }
  .pw-title {
    font: 12px 'Open Sans', system-ui, sans-serif;
    letter-spacing: 2px; color: #d0d8f0; text-transform: uppercase;
  }
  #pwSub {
    font: 9px 'Open Sans', system-ui, sans-serif;
    letter-spacing: 1.5px; color: #5a6280; text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="pleaseWaitOverlay">
  <div class="pw-spin" id="pwSpin"></div>
  <div class="pw-title">Please Wait...</div>
  <div id="pwSub">Finding latest version</div>
</div>

<script>
const API = "https://api.github.com/repos/aphidaks/aphidaks/contents/sirenosc";

const cmp = (a, b) => {
  const pa = a.slice(1).split(".").map(Number);
  const pb = b.slice(1).split(".").map(Number);
  for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
  return 0;
};

async function discoverVersions() {
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (!res.ok) return [];
    const items = await res.json();
    return items
      .filter(i => i.type === "dir" && /^v\d+\.\d+\.\d+$/.test(i.name))
      .map(i => i.name);
  } catch (e) {
    return [];
  }
}

async function hasLatest(version) {
  try {
    const res = await fetch(`${version}/latest`, { cache: "no-store" });
    return res.ok;
  } catch (e) {
    return false;
  }
}

(async () => {
  const versions = (await discoverVersions()).sort(cmp);
  for (const v of versions) {
    if (await hasLatest(v)) {
      location.replace(`${v}/`);
      return;
    }
  }
  document.getElementById("pwSpin").style.animation = "none";
  document.getElementById("pwSub").textContent = "The latest version has not been found";
})();
</script>
</body>
