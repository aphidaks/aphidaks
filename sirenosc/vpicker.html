<style>
:root {
  --bg:#0b0c0d; --inset:#0b0c0d; --panel:#111214; --panel2:#1a1b1e; --border:#2a2d33;
  --accent:#00e5a0; --accent2:#00b8d9; --text:#d0d8f0; --muted:#5a6280;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; padding: 20px 12px; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font: 12px 'Open Sans', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
.wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }

/* header */
.header {
  display: flex; align-items: center; gap: 12px; padding: 10px 18px;
  background: var(--inset); border: 1px solid var(--border); border-radius: 2px;
}
.logo-img { display: block; height: 34px; width: auto; }
.header-sub { margin-left: auto; font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

/* panel */
.sec {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 2px; padding: 11px;
}
.sec-title { font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 0 0 10px 2px; }

/* version rows */
#list { display: none; flex-direction: column; gap: 8px; }
.vrow {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 2px;
  color: var(--text); text-decoration: none; text-transform: uppercase; letter-spacing: 1px;
  transition: border-color .12s, background-color .12s, transform .12s;
}
.vrow:hover, .vrow:focus-visible { border-color: var(--accent2); background-color: #14181c; outline: none; }
.vrow:active { transform: scale(.99); }
.vrow.latest { border-color: var(--accent); }
.vrow.latest:hover, .vrow.latest:focus-visible { border-color: var(--accent); background-color: #101a17; }
.vname { font-size: 14px; }
.vname b { font-weight: 400; color: #e6e6e6; }
.vname b span { color: var(--accent2); }
.vtag { display: none; margin-left: 8px; font-size: 11px; color: var(--accent); }
.vrow.latest .vtag { display: inline; }
.vmeta { margin-left: auto; text-align: right; font-size: 10px; line-height: 1.5; }
.vmeta .k { display: block; font-size: 8px; letter-spacing: 2px; color: var(--muted); }
.vmeta .d { color: var(--text); }
.vmeta .d.off { color: var(--muted); }
.varrow { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); transition: color .12s, transform .12s; }
.vrow:hover .varrow, .vrow:focus-visible .varrow { color: var(--accent2); transform: translateX(2px); }
.vrow.latest:hover .varrow, .vrow.latest:focus-visible .varrow { color: var(--accent); }

/* loading / error */
#loading, #error { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 26px 10px; text-align: center; }
.pw-spin { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: #d0d8f0; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pw-title { font: 12px 'Open Sans', system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
.pw-sub { font: 9px 'Open Sans', system-ui, sans-serif; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; max-width: 380px; line-height: 1.7; }
.codeblock {
  display: block; width: 100%; max-width: 100%; padding: 9px 12px; text-align: left;
  background: var(--inset); border: 1px solid var(--border); border-radius: 2px;
  font: 11px 'Open Sans', system-ui, sans-serif; letter-spacing: .5px; color: var(--text);
  white-space: pre-wrap; word-break: break-word; user-select: all;
}
.vbtn {
  background: transparent; border: 1px solid var(--accent2); border-radius: 2px; color: var(--accent2);
  font: 11px 'Open Sans', system-ui, sans-serif; letter-spacing: 1px; text-transform: uppercase;
  padding: 6px 14px; cursor: pointer;
}
.vbtn:hover { background-color: rgba(0,184,217,.15); }
.vbtn:active { transform: scale(.97); }

@media (max-width: 460px) {
  .vrow { flex-wrap: wrap; row-gap: 6px; }
  .vmeta { margin-left: 0; text-align: left; order: 3; width: 100%; }
  .varrow { margin-left: auto; }
}
</style>
</head>

  </div>

  <div class="sec">
    <p class="sec-title">Select a version</p>

    <div id="loading">
      <div class="pw-spin"></div>
      <div class="pw-title">Please Wait...</div>
      <div class="pw-sub">Finding versions</div>
    </div>

    <div id="error">
      <div class="pw-title" id="errTitle">Couldn't load versions</div>
      <div class="pw-sub" id="errSub"></div>
      <div class="pw-sub">You may also edit the URL to your desired version</div>
      <code class="codeblock">e.g. aphidaks.com/sirenosc/v1.3.2 &rarr; aphidaks.com/sirenosc/v1.4.0</code>
      <button class="vbtn" id="retry" type="button">Retry</button>
    </div>

    <div id="list"></div>
  </div>
</div>

<script>
// where to look for version folders (vX.Y.Z); update this when cloning the git
const API = "https://api.github.com/repos/aphidaks/aphidaks/contents/sirenosc";

const $ = id => document.getElementById(id);
const cmp = (a, b) => {
  const pa = a.slice(1).split(".").map(Number);
  const pb = b.slice(1).split(".").map(Number);
  for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
  return 0;
};

// null = could not reach the list, [] = reached it but no versions in it
async function discoverVersions() {
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (!res.ok) return null;
    const items = await res.json();
    return items
      .filter(i => i.type === "dir" && /^v\d+\.\d+\.\d+$/.test(i.name))
      .map(i => i.name);
  } catch (e) {
    return null;
  }
}

async function hasLatest(version) {
  try {
    const res = await fetch(`${version}/latest`, { cache: "no-store" });
    return res.ok;
  } catch (e) {
    return false;
  }
}

// "Last Modified" header of that version's HTML file
async function lastModified(version) {
  const url = `${version}/`;
  for (const method of ["HEAD", "GET"]) {
    try {
      const res = await fetch(url, { method, cache: "no-store" });
      if (!res.ok) continue;
      const h = res.headers.get("last-modified");
      const d = h ? new Date(h) : null;
      if (d && !isNaN(d)) return d;
      return null;
    } catch (e) { /* try the next method */ }
  }
  return null;
}

const fmtDate = d => d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

function show(which) {
  $("loading").style.display = which === "loading" ? "flex" : "none";
  $("error").style.display   = which === "error"   ? "flex" : "none";
  $("list").style.display    = which === "list"    ? "flex" : "none";
}

function showError(title, sub) {
  $("errTitle").textContent = title;
  $("errSub").textContent = sub;
  show("error");
}

const ARROW = '<svg class="varrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h11M9 3.5L13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderRows(versions) {
  const list = $("list");
  list.textContent = "";
  for (const v of versions) {                       // v is validated as vX.Y.Z above
    const a = document.createElement("a");
    a.className = "vrow";
    a.href = `${v}/`;
    a.dataset.v = v;
    a.innerHTML =
      `<span class="vname"><b>Siren<span>Osc</span> V${v.slice(1)}</b><span class="vtag">(Latest)</span></span>` +
      `<span class="vmeta"><span class="k">Released</span><span class="d off">…</span></span>` +
      ARROW;
    list.appendChild(a);
  }
}

async function load() {
  show("loading");
  const versions = await discoverVersions();
  if (versions === null) {
    showError("Couldn't load versions",
      "The version list could not be reached. GitHub limits how many times it can be asked per hour, so try again in a bit.");
    return;
  }
  if (!versions.length) {
    showError("No versions found", "There are no version folders to show yet.");
    return;
  }
  versions.sort(cmp);
  renderRows(versions);
  show("list");

  // release dates fill in as they arrive
  versions.forEach(async v => {
    const d = await lastModified(v);
    const el = document.querySelector(`.vrow[data-v="${v}"] .d`);
    if (!el) return;
    el.textContent = d ? fmtDate(d) : "Unknown";
    el.classList.toggle("off", !d);
  });

  // newest version that has a "latest" marker is the Latest; if none do, the highest version is
  const flags = await Promise.all(versions.map(hasLatest));
  const idx = flags.indexOf(true);
  const latest = versions[idx === -1 ? 0 : idx];
  const row = document.querySelector(`.vrow[data-v="${latest}"]`);
  if (row) row.classList.add("latest");
}

$("retry").addEventListener("click", load);
load();
</script>
